<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 60" role="img" aria-labelledby="title"><title id="title">Why my backend work carries over to agents</title><style>text{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes rain{from{transform:translateY(-38px)}to{transform:translateY(48px)}}
@keyframes pulse{50%{opacity:.72}}
.type{animation:reveal .8s steps(32,end) both}.row{animation:appear .5s both}
.cursor{animation:blink 1.1s step-end infinite}.portrait{animation:pulse 7s ease-in-out 3s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;clip-path:none!important;opacity:1!important}}
</style><rect x="0" y="0" width="620" height="60" fill="#0d1117" rx="16"/><text x="18" y="31" font-size="20" fill="#c9d1d9" class="type">Why my backend work carries over to agents</text><rect x="18" y="45" width="560" height="2" fill="#58a6ff" class="type"/></svg>