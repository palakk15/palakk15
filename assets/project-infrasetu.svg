<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" aria-labelledby="title"><title id="title">InfraSetu: 40% less manual tracking. Audit trails · 8 dashboards</title><style>text{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
